apply plugin: 'com.android.application'

def platformVersion = 16   // OUYA = Android 4.1 (API 16), Tegra 3, GLES2 only

android {
    compileSdkVersion 30
    ndkVersion '23.2.8568313'   // last NDK supporting android-16 on armeabi-v7a

    defaultConfig {
        applicationId 'com.ryo.armagetronadouya'
        minSdkVersion platformVersion
        targetSdkVersion 30
        versionCode 10
        // Port releases are numbered rN, decoupled from the engine version: the
        // engine base is the upstream 0.4 development trunk (ahead of the 0.2.9.x
        // stable line) — see README "Which Armagetron version is this?".
        versionName "0.4-trunk-ouya-r10"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-${platformVersion}",
                          "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17 -frtti -fexceptions"   // Armagetron uses heavy RTTI + exceptions
            }
        }
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // OUYA release signing. Credentials live in keystore.properties (gitignored). Falls back
    // to the debug key when absent so a keyless clone still builds.
    signingConfigs {
        release {
            def kpFile = rootProject.file('keystore.properties')
            if (kpFile.exists()) {
                def kp = new Properties()
                kp.load(new FileInputStream(kpFile))
                storeFile rootProject.file(kp['storeFile'])
                storePassword kp['storePassword']
                keyAlias kp['keyAlias']
                keyPassword kp['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig rootProject.file('keystore.properties').exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}
