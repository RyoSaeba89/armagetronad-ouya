# autoexec.cfg -- loaded on EVERY launch (after user.cfg), at owner access level.
# This is where the OUYA gamepad is bound, so the controller always works in-game
# regardless of any stale user.cfg.
#
# REAL OUYA controller layout (confirmed via logcat on hardware):
#   - D-pad       = joystick BUTTONS 11/12/13/14 (NOT a hat, NOT arrow keys)
#       11 = up, 12 = down, 13 = left, 14 = right
#   - Left stick  = AXIS 0 (X) / AXIS 1 (Y); engine filters out the phantom
#     accelerometer (joystick instance 1) and the trigger/right-stick axes.
# Menu navigation is handled in the engine (su_GetMenuInput maps pad buttons AND
# the left stick — behind a Schmitt trigger — to nav keys), so the binds below
# only act during play.
#
# In-game player 1 controls:
#   Left stick         -> analog steering (native gJoystick: point where you
#                         want to go, camera-relative, ~70% deflection needed)
#   D-pad left/right   -> turn (digital, one turn per press)
#   D-pad down         -> brake
#   OUYA system button -> open/close the in-game menu (single press = KEYCODE_MENU,
#                         the standard OUYA pause convention; arrives as the
#                         keyboard key SCANCODE_MENU through SDL)
#   START (button 6)   -> same, for non-OUYA pads (Xbox etc.) without a system key
#   O (button 0)       -> select in menus only; intentionally unbound in-game

# --- Left stick (axes 0/1) -> native analog steering (gJoystick) ---
# JOY_* actions feed a direction vector; the engine turns the cycle toward it
# with built-in deadzone and turn hysteresis. No double input with the d-pad:
# these are separate physical inputs on separate action paths.
KEYBOARD	JOYSTICK_1_AXIS_0_-	PLAYER_BIND	JOY_LEFT	1
KEYBOARD	JOYSTICK_1_AXIS_0_+	PLAYER_BIND	JOY_RIGHT	1
KEYBOARD	JOYSTICK_1_AXIS_1_-	PLAYER_BIND	JOY_UP	1
KEYBOARD	JOYSTICK_1_AXIS_1_+	PLAYER_BIND	JOY_DOWN	1

# --- D-pad (buttons 11-14) ---
KEYBOARD	JOYSTICK_1_BUTTON_13	PLAYER_BIND	CYCLE_TURN_LEFT	1
KEYBOARD	JOYSTICK_1_BUTTON_14	PLAYER_BIND	CYCLE_TURN_RIGHT	1
KEYBOARD	JOYSTICK_1_BUTTON_12	PLAYER_BIND	CYCLE_BRAKE	1

# --- In-game menu: OUYA system button (KEYCODE_MENU) + START on generic pads ---
KEYBOARD	SCANCODE_MENU	PLAYER_BIND	INGAME_MENU	0
KEYBOARD	JOYSTICK_1_BUTTON_6	PLAYER_BIND	INGAME_MENU	0

# --- Camera switch (OUYA "U" = X position = SDL BUTTON_2) ---
# Binds the camera-mode switch (default keyboard "n") to the X button, so the
# recurring "Press N to switch camera modes" tooltip can be dismissed on the pad.
KEYBOARD	JOYSTICK_1_BUTTON_2	PLAYER_BIND	SWITCH_VIEW	1

# ===== INPUT TOOLTIPS (the "Press and hold J to glance left" nags) =====
# Each <ACTION>_TOOLTIP holds the per-player "activations left" counter (5 slots,
# players 0..4); a tooltip shows while its counter > 0. They are seeded in
# default.cfg, which only loads on first run -- so after a data wipe they come
# back. Forcing them all to "0 0 0 0 0" here (autoexec runs every launch) kills
# every forced keyboard hint on the gamepad-only OUYA build for good.
CYCLE_TURN_LEFT_TOOLTIP   0 0 0 0 0
CYCLE_TURN_RIGHT_TOOLTIP  0 0 0 0 0
CYCLE_BRAKE_TOOLTIP       0 0 0 0 0
GLANCE_LEFT_TOOLTIP       0 0 0 0 0
GLANCE_RIGHT_TOOLTIP      0 0 0 0 0
GLANCE_BACK_TOOLTIP       0 0 0 0 0
GLANCE_FORWARD_TOOLTIP    0 0 0 0 0
SWITCH_VIEW_TOOLTIP       0 0 0 0 0
CHAT_TOOLTIP              0 0 0 0 0
TOGGLE_SPECTATOR_TOOLTIP  0 0 0 0 0
INGAME_MENU_TOOLTIP       0 0 0 0 0
COCKPIT_KEY_1_TOOLTIP     0 0 0 0 0

# ===== DISPLAY =====
# Force fullscreen every launch so a stale user.cfg can never leave us windowed.
# The actual render buffer is pinned to 720p by SDLSurface.setFixedSize() and
# upscaled by the OS to fill the whole panel.
FULLSCREEN 1
LAST_FULLSCREEN 1

# ===== PERFORMANCE (Tegra 3 is GPU/fill-bound; cut overdraw, keep legibility) =====
ALPHA_BLEND 0          # opaque walls: kills per-pixel blending + overdraw (also more legible)
FLOOR_MIRROR 0         # no reflected second pass
FLOOR_DETAIL 1         # 1=procedural grid lines (extension raised 4x on Android -> near-full-arena grid at 60fps). 2=textured floor=29fps fill-bound, 0=nothing
HIGH_RIM 0             # lower-detail rim walls
DITHER 0               # no dithering pass
TEXTURES_HI 0          # 16-bit textures: less bandwidth
TEXT_OUT 1             # keep HUD/text
MOTION_BLUR_TIME 0     # no motion-blur accumulation
